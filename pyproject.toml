[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "double-pendulum-rl"
version = "0.1.0"
description = "Wheel-legged robot reinforcement learning with Isaac Lab"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["double_pendulum_rl*"]
exclude = ["assets*", "configs*", "scripts*"]
